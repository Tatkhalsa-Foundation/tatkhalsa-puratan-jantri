    <!-- Pre-paint theme bootstrap to avoid flash in Surmai Night / Hazuri Kesri -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tatkhalsa_jantri_theme');
          if (t === 'surmai' || t === 'kesri' || t === 'parchment') {
            document.documentElement.dataset.theme = t;
            if (t === 'surmai') document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();

        <p>
          Tat Khalsa Puratan Jantri is a traditional Sikh Puratan Bikrami Sambat luni-solar calendar by Tatkhalsa Foundation covering Sambat 2082–2084. Calculated from Sri Anandpur Sahib (IST) Udaya Sangrands, it tracks 12 Punjabi solar months, Sudhi/Vadhi lunar tithis, Puranmashi, Masya, Gurpurabs, Shaheedi Divases, Barsis, and primary scriptural references at pothi.tatkhalsa.in. Enable JavaScript for the interactive calendar and .ics export.
        </p>
